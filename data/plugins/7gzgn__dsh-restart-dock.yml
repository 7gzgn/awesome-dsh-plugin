url: "https://github.com/7gzgn/dsh-restart-dock"
name: "dsh-restart-dock"
category: dev
description:
  en: "A small dock in the DSH Web UI: restart the host or reload the page in one click. Restart asks first (now / 30s / 60s / 2min / cancel); the dock drags to any edge only after a 320ms hold, and stays anchored when the window resizes. Refresh checks the plugin bundle first and refuses when it is still rebuilding or broken, so a reload can never brick the app."
  zh: DSH 界面上一小框：一键重启宿主、一键刷新页面。重启会先问「立即 / 30 秒 / 60 秒 / 2 分钟 / 取消」，倒计时可撤回；小框需长按 320ms 才能拖动（避免手一抖就粘住），拖到边缘自动吸附，窗口缩放时跟着走；刷新前先检查插件包，重建中或包坏了就不刷，避免把应用刷成起不来的样子。